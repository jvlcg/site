name: Sincronizar artigos da Soro

# Copia os artigos publicados na Soro para o blog em MDX e envia para a `main`.
# O push dispara o deploy automático na Vercel — nada precisa ser feito à mão.
on:
  schedule:
    # A cada 15 minutos. A Soro não avisa quando algo é publicado, então a única
    # forma de saber é perguntar; consultar de hora em hora deixaria um texto
    # recém-publicado esperando tempo demais para aparecer no blog.
    #
    # O agendamento do GitHub é "melhor esforço": em horários de pico ele pode
    # atrasar alguns minutos. Na prática, um artigo entra no ar em torno de 20
    # minutos depois de publicado na Soro.
    - cron: "*/15 * * * *"
  # botão "Run workflow" na aba Actions — publica na hora, sem esperar
  workflow_dispatch:
  # gancho para automação externa: um POST em /dispatches com
  # {"event_type":"soro-publicou"} dispara esta sincronização na mesma hora
  repository_dispatch:
    types: [soro-publicou]

# necessário para o robô conseguir gravar o commit
permissions:
  contents: write
  # necessário para disparar a análise do FAQ quando algo é publicado
  actions: write

# se um deploy já estiver rodando, espera em vez de disputar
concurrency:
  group: sync-soro
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    # Prazo de dez minutos, contra o padrão do GitHub, que é seis horas.
    #
    # Aqui a execução normal leva **meio minuto**: buscar na Soro, ver que não
    # mudou nada e sair. Quando há artigo novo, o build acrescenta uns poucos
    # minutos. Dez é folgado para o pior caso real e curto o bastante para uma
    # execução travada não segurar a fila.
    #
    # Por que isso importa: o grupo de concorrência aceita só uma execução
    # esperando. Se uma emperrar, a próxima fica pendente e a seguinte
    # **cancela a pendente** — e cada cancelamento manda um e-mail de alarme
    # sobre um problema que não existe. Foi o que aconteceu em 06/08: duas
    # execuções ficaram exatos 15 minutos na fila, sem rodar nada, e foram
    # descartadas. Com prazo, a que emperra morre sozinha e a fila anda.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Buscar artigos na Soro
        run: node scripts/sync-soro.mjs

      # Rodando a cada 15 minutos, a maioria das execuções não encontra nada.
      # Conferir aqui evita compilar o site inteiro à toa 90 vezes por dia.
      - name: Houve mudança?
        id: mudou
        run: |
          if [ -z "$(git status --porcelain content/artigos public/images/blog)" ]; then
            echo "sim=false" >> "$GITHUB_OUTPUT"
            echo "Nenhum artigo novo ou alterado."
          else
            echo "sim=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Conferir que o site ainda compila
        if: steps.mudou.outputs.sim == 'true'
        run: npm run build

      - name: Publicar
        if: steps.mudou.outputs.sim == 'true'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/artigos public/images/blog
          git commit -m "Sincroniza artigos da Soro

          Gerado automaticamente por scripts/sync-soro.mjs."
          # a `main` pode ter andado enquanto o build rodava
          git pull --rebase origin main
          git push

      # Só aqui, e não a cada checagem: assunto novo no blog costuma ser
      # exatamente o assunto que ainda não tem pergunta no FAQ.
      - name: Pedir uma análise do FAQ
        if: steps.mudou.outputs.sim == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run faq-oportunidades.yml --ref "${{ github.ref_name }}" || true
